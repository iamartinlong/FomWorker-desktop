# FomWorker bundle patch —— 作为一层挂进 dsh profile（在 web-app 层之后、profile 自身 patch 之前）。
#
# 行 id 与原先手工写在 `~/.dsh/profiles/web/cordis.patch.yml` 的一致。
# `name` 说明：
#   - 品牌 occupant 走**包名**（junction 进 profile node_modules 的 @fominfo/dsh-client-ui-brand-fomworker）；
#   - 办公插件是 office-platform 里的 `.ts`（暂未迁入 apps/fom-client），故用**绝对路径**（避免相对解析歧义）。
# 迁移到 apps/fom-client/plugins/ 后，这里应改为包名或相对路径。

- insert:
    - id: ui-brand-fomworker
      name: '@fominfo/dsh-client-ui-brand-fomworker'
    - id: ui-login
      name: '@fominfo/dsh-client-ui-login'
      config:
        providerId: fom-platform
        provider:
          api: openai-completions
          baseURL: 'http://127.0.0.1:5199/v1'
          apiKeyEnv: FOM_PLATFORM_TOKEN
          models:
            - id: deepseek-v4.1-flash
              name: DeepSeek V4.1 Flash
              contextWindow: 128000
              maxTokens: 8192
              input: [text]
              reasoningEfforts: false
    - id: office-catalog
      name: 'F:/deepseek/deepseek harness/office-platform/plugins/office-catalog/index.ts'
    - id: office-authz
      name: 'F:/deepseek/deepseek harness/office-platform/plugins/office-authz/index.ts'
    - id: office-console
      name: 'F:/deepseek/deepseek harness/office-platform/plugins/office-console/index.ts'
