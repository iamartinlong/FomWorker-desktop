# A 阶段 · A2 计量挂载件（M2/A2 · 平台层 P0 / 成本 C-P0）
#
# 把 `office-meter` 挂进 web profile：它把会话用量采集/聚合以只读服务（`officeMeter`）暴露出去——
# `collect(homeDir)` 读一个 `$DSH_HOME/sessions`（zstd 走 node:zlib）、按会话折叠、按天合并。
# 依据：`docs/02-设计/平台层设计v0.1.md` §4.2、`成本治理设计v0.1.md`。
#
# 用法（在 `deepseek-harness/` 仓库根；`--patch` 必须排在 `--port`/`--no-open` 之前）：
#   node --import tsx/esm apps/cli/src/bin.ts web \
#     --patch "F:/deepseek/deepseek harness/apps/fom-client/office-meter.patch.yml" \
#     --no-open --port 3094
# 静态核：`--dump-config` 里出现 `id: office-meter`。

- insert:
    - id: office-meter
      name: ./plugins/office-meter/index.ts
