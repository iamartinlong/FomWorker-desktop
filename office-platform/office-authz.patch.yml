# A 阶段 · K-P0 授权骨架挂载件
#
# 把 `office-authz` 挂进 web profile：它只做一件事——`ctx.reflect.provide('officeAuthz', { can, requiresApproval, assertCan })`，
# 把「角色 × 动作」授权矩阵（含「高危须审批」）以只读服务暴露出去。控制台的 Remote 方法首行调它（K-P0）。
# 依据：`docs/02-设计/控制台写操作权限设计v0.1.md`、`路由与权限模型设计v0.1.md`。
#
# 用法（在 `deepseek-harness/` 仓库根；`--patch` 必须排在 `--port`/`--no-open` 之前）：
#   node --import tsx/esm apps/cli/src/bin.ts web \
#     --patch "F:/deepseek/deepseek harness/office-platform/office-authz.patch.yml" \
#     --no-open --port 3093
# 静态核：`--dump-config` 里出现 `id: office-authz`。

- insert:
    - id: office-authz
      name: ./plugins/office-authz/index.ts
