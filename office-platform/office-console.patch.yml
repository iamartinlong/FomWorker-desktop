# 最小只读 L1 界面挂载件（office-console）
#
# office-console 依赖 `officeCatalog`（`inject:['officeCatalog']`）与 `officeAuthz`（`inject:['officeAuthz']`），
# 所以**必须与 `office-catalog.patch.yml` 和 `office-authz.patch.yml` 一起挂**，否则它等不到服务、整层不装。
#
# 用法（在 `deepseek-harness/` 仓库根；`--patch` 必须排在 `--port`/`--no-open` 之前）：
#   node --import tsx/esm apps/cli/src/bin.ts web \
#     --patch "F:/deepseek/deepseek harness/office-platform/office-catalog.patch.yml" \
#     --patch "F:/deepseek/deepseek harness/office-platform/office-console.patch.yml" \
#     --no-open --port 3092
# 静态核：`--dump-config` 里出现 `id: office-catalog` 与 `id: office-console`。
# 真进程核：`GET /office/catalog` 返回目录 JSON。

- insert:
    - id: office-console
      name: ./plugins/office-console/index.ts
